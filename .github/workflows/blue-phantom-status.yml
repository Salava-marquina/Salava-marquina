name: "🔵 BLUE PHANTOM — Status Uplink"

# MISSION BRIEFING:
# Runs on a schedule, on manual trigger, and on every push to main.
# Pulls live signal from the network (GitHub API), writes it into the
# LIVE STATUS UPLINK block in README.md, and pushes the update.

on:
  schedule:
    - cron: "0 */6 * * *"   # operation cycle: every 6 hours
  workflow_dispatch:         # manual override from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  mission-status-sync:
    name: "MISSION: Status Sync"
    runs-on: ubuntu-latest
    steps:
      - name: "OPERATION: Establish uplink (checkout)"
        uses: actions/checkout@v4

      - name: "OPERATION: Deploy toolkit (setup python)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: "OPERATION: Sweep the network for signal"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/blue_phantom_status.py

      - name: "OPERATION: Secure and transmit uplink"
        run: |
          git config --global user.name "blue-phantom-bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "🔵 BLUE PHANTOM :: status uplink refreshed [skip ci]" && git push)
