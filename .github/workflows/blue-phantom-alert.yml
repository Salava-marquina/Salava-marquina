name: "🕶️ BLUE PHANTOM — Sentinel Watch"

# MISSION BRIEFING:
# Watches every run of the Status Uplink workflow. When it completes —
# success or failure — this logs the outcome into the INTEL LOG section
# of README.md. A clean run becomes "systems secured"; a broken run
# becomes a security alert. This is the failure -> alert mapping in
# the theme, made literal.

on:
  workflow_run:
    workflows: ["🔵 BLUE PHANTOM — Status Uplink"]
    types: [completed]

permissions:
  contents: write

jobs:
  sentinel-log:
    name: "MISSION: Log Operation Outcome"
    runs-on: ubuntu-latest
    steps:
      - name: "OPERATION: Establish uplink (checkout)"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: "OPERATION: Deploy toolkit (setup python)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: "OPERATION: File the intel report"
        env:
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: python scripts/blue_phantom_alert.py

      - name: "OPERATION: Secure and transmit log"
        run: |
          git config --global user.name "blue-phantom-bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "🕶️ BLUE PHANTOM :: intel log updated [skip ci]" && git push)
